---
imports:
  - hosts.yaml

tasks:
  upload_500mb:
    description: "Upload 500MB test file to measure throughput"
    stop_on_error: true
    local_command: |
      #!/usr/bin/env bash
      # Create 500MB test file with non-compressible data
      dd if=/dev/urandom of=/tmp/test_500mb.bin bs=1M count=500 status=progress
    upload:
      - "/tmp/test_500mb.bin /tmp/"
    remote_command:
      - "ls -lh /tmp/test_500mb.bin"
      - "rm /tmp/test_500mb.bin"

task_groups:
  upload_test:
    - name: "500MB Upload Test"
    - task: upload_500mb
      hosts: rhel10
