# 12 — Third imported file overrides color
---

imports:
  - fifth.yaml

vars:
  color: "green"

tasks:
  echo_third:
    description: "Echo color from third"
    local_command:
      - 'echo "third={{ color }}"'

task_groups:
  third_group:
    - name: "Third Color"
    - task: echo_third
    - task: echo_fifth
